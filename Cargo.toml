[package]
name = "jlo-bin"
version = "0.4.0"
edition = "2024"
authors = ["Oliver Siegmar <oliver@siegmar.de>"]
license = "MIT"

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# `unwrap` hides the invariant that makes it safe; `expect` states it.
unwrap_used = "warn"
# Codebase convention: every fallible path returns a descriptive error.
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# Paths are deliberately Debug-quoted in user-facing messages: the quotes make
# trailing whitespace and odd characters visible when a path is wrong.
unnecessary_debug_formatting = "allow"

[dev-dependencies]
assert_cmd = "2"
mockito = "1"
predicates = "3"
serial_test = "4"
# Already compiled as normal dependencies; repeated here so the integration
# tests can build the release tarball `selfupdate` downloads and checksum it
# the same way the release workflow does, instead of shelling out to tools
# whose flags differ between macOS and GNU userlands.
flate2 = "1.1.4"
tar = "0.4"
sha2 = "0.11.0"
hex = "0.4.3"

[dependencies]
anyhow = "1"
# jlo is fully synchronous; ureq is a blocking client, so there is no tokio
# runtime to embed. native-tls keeps the platform TLS stack jlo has always used.
# ureq gates its native-tls transport on the `native-tls` feature by name, so
# the bundled-Mozilla-roots dependency it drags in is unavoidable; the agent
# selects RootCerts::PlatformVerifier so the system trust store is used anyway.
ureq = { version = "3", default-features = false, features = ["json", "native-tls"] }
indicatif = "0.18.0"
console = "0.16.1"
flate2 = "1.1.4"
tar = "0.4"
tempfile = "3.23.0"
sha2 = "0.11.0"
hex = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
# Hand-written parser with no dependencies of its own. `semver_rs` pulled the
# whole `regex` engine into the release binary just to compare version strings.
semver = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# `selfupdate` holds an exclusive lock across the `exec` of the binary it just
# published, which needs `flock` and an `fcntl` that clears `FD_CLOEXEC` -
# neither is in std. rustix wraps both safely, so the crate keeps its
# `unsafe_code = "deny"`, and it is already in the tree via tempfile.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
