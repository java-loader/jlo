on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (if needed)
        run: rustup update

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Rustdoc
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check advisories, licenses, bans and sources
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3

  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            package: jlo-linux-x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
            package: jlo-linux-aarch64
          - os: macos-latest
            arch: aarch64
            package: jlo-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (if needed)
        run: rustup update

      - name: Install zsh (autoload tests source the hook in a real zsh)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      # The three real-network tests (home, exec, env) install a
      # real Temurin JDK. They do it into target/tmp/network-home rather than
      # the runner's $HOME, so it is a path that can be carried between runs:
      # without this every job downloads ~200 MB from Adoptium.
      - name: Cache the JDK store used by the real-network tests
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/tmp/network-home
          key: jdk-store-${{ matrix.os }}-${{ matrix.arch }}

      - name: Build release
        run: cargo test --release
        env:
          RUST_BACKTRACE: full

      # zsh files are not checked: ShellCheck has no zsh dialect. The stubs are
      # generated by the binary, so they are checked as __install writes them.
      # The entry stubs are POSIX sh; the installed implementation files carry
      # their own shell directive. SC1090/SC1091: every stub sources a file
      # chosen at runtime by design.
      - name: ShellCheck
        if: matrix.os == 'ubuntu-latest'
        run: |
          shellcheck shell/*.sh install.sh
          export HOME="$RUNNER_TEMP/sc" JLO_HOME="$RUNNER_TEMP/sc/.jlo"
          target/release/jlo-bin __install >/dev/null
          shellcheck -s sh -e SC1090,SC1091 "$JLO_HOME"/*.sh
          shellcheck -e SC1090,SC1091 "$JLO_HOME"/bin/*.sh

      - name: Build package
        run: tar --no-same-owner -czf ${{ matrix.package }}.tar.gz -C target/release jlo-bin

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.package }}-artifact
          path: jlo-*.tar.gz
