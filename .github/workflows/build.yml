on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (if needed)
        run: rustup update

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  deny:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check advisories, licenses, bans and sources
        uses: EmbarkStudios/cargo-deny-action@v2

  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            package: jlo-linux-x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
            package: jlo-linux-aarch64
          - os: macos-latest
            arch: aarch64
            package: jlo-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (if needed)
        run: rustup update

      - name: Install zsh (autoload tests source the hook in a real zsh)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      # The three real-network tests (home, exec, env - ADR-0002) install a
      # real Temurin JDK. They do it into target/tmp/network-home rather than
      # the runner's $HOME, so it is a path that can be carried between runs:
      # without this every job downloads ~200 MB from Adoptium.
      - name: Cache the JDK store used by the real-network tests
        uses: actions/cache@v4
        with:
          path: target/tmp/network-home
          key: jdk-store-${{ matrix.os }}-${{ matrix.arch }}

      - name: Build release
        run: cargo test --release
        env:
          RUST_BACKTRACE: full

      # zsh files are not checked: ShellCheck has no zsh dialect. The stubs are
      # generated by the binary, so they are checked as __install writes them.
      # SC1090/SC1091: every stub sources a file chosen at runtime by design.
      - name: ShellCheck
        if: matrix.os == 'ubuntu-latest'
        run: |
          shellcheck shell/*.bash install.sh
          export HOME="$RUNNER_TEMP/sc" JLO_HOME="$RUNNER_TEMP/sc/.jlo"
          target/release/jlo-bin __install >/dev/null
          shellcheck -s sh -e SC1090,SC1091 "$JLO_HOME"/*.sh "$JLO_HOME"/bin/*.sh

      - name: Build package
        run: tar --no-same-owner -czf ${{ matrix.package }}.tar.gz -C target/release jlo-bin

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}-artifact
          path: jlo-*.tar.gz
