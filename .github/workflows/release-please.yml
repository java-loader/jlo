name: release-please

on:
  push:
    branches:
      - main
  # Recovery hatch: release-please only creates a tag once, so if the build or
  # upload job fails the release is left a draft without assets and nothing
  # re-triggers them. This lets you rebuild and upload for a tag that already
  # exists, and publishes it if it is still a draft.
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to build and upload assets for
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Single source of truth for "which tag are we packaging", so build and upload
  # agree whether this run came from release-please or from a manual dispatch.
  resolve:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.pick.outputs.tag_name }}
    steps:
      - id: pick
        # Via env rather than inline ${{ }}, so a tag name never lands in the
        # shell as code.
        env:
          TAG_NAME: ${{ inputs.tag_name || needs.release-please.outputs.tag_name }}
        run: echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    # An explicit result check, because a skipped job propagates down the whole
    # needs chain: on a manual dispatch release-please is skipped, and without
    # this build would be skipped too even though resolve succeeded.
    if: ${{ always() && needs.resolve.result == 'success' }}
    # Narrower than the workflow-wide block above: this job only reads the
    # sources, but it does mint an OIDC token and write an attestation. Nothing
    # here needs write access to the repository.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            package: jlo-linux-x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
            package: jlo-linux-aarch64
          - os: macos-latest
            arch: aarch64
            package: jlo-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      # Build the tagged source, not whatever main happens to be: on a manual
      # dispatch the workflow file comes from main but the sources must not.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag_name }}

      - name: Install Rust (if needed)
        run: rustup update

      - name: Install zsh (autoload tests source the hook in a real zsh)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Build and test
        run: cargo test --release
        env:
          RUST_BACKTRACE: full

      - name: Build package
        run: tar --no-same-owner -czf ${{ matrix.package }}.tar.gz -C target/release jlo-bin

      # The updater verifies this before it unpacks anything. It shares an
      # origin with the tarball, so it catches a corrupt or truncated download,
      # not a compromised release - the attestation below is what narrows that
      # gap, and only for whoever runs 'gh attestation verify'.
      #
      # Written with the bare file name (no path), so 'shasum -a 256 -c' works
      # from whatever directory the tarball was downloaded into.
      - name: Checksum package
        env:
          PACKAGE: ${{ matrix.package }}
        run: shasum -a 256 "$PACKAGE.tar.gz" > "$PACKAGE.tar.gz.sha256"

      # Ties the tarball to the workflow run and the commit that produced it.
      # No key management on our side; verifiable with
      #   gh attestation verify jlo-<platform>.tar.gz --repo java-loader/jlo
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ matrix.package }}.tar.gz

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}-artifact
          path: jlo-*.tar.gz*

  upload:
    needs: [resolve, build]
    if: ${{ always() && needs.resolve.result == 'success' && needs.build.result == 'success' }}
    # One upload at a time across tags, so two publishes cannot both read the
    # same latest release and move it backwards. A third run queued behind
    # them cancels the waiting one; its release stays a draft for the manual
    # dispatch.
    concurrency:
      group: release-upload
      cancel-in-progress: false
    # Written out in full because a job-level block replaces the workflow-wide
    # one: the release upload needs contents: write, the attestation of
    # install.sh an OIDC token.
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      # install.sh ships with the release, so the documented install line
      # (releases/latest/download/install.sh) fetches the script and the
      # tarball from one tag. Taken from the tagged checkout for the same reason
      # build is: on a manual dispatch the workflow file comes from main, and
      # the script must not.
      - name: Check out install.sh of the tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag_name }}
          path: tagged
          sparse-checkout: /install.sh
          sparse-checkout-cone-mode: false

      # No .sha256 beside it: a script piped into a shell is never checked
      # against one, and it would share the script's origin anyway. Verifiable
      # with
      #   gh attestation verify install.sh --repo java-loader/jlo
      - name: Attest install.sh
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: tagged/install.sh

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: .

      # draft: true, because the action otherwise publishes a draft it uploads
      # to - and makes it latest, whichever release that is. Publishing is the
      # next step's call.
      - name: Upload to versioned release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag_name }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            jlo-*.tar.gz
            jlo-*.tar.gz.sha256
            tagged/install.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # release-please creates the release as a draft (release-please-config.json),
      # so releases/latest - the install line, install.sh's own download and
      # 'jlo update''s hint - moves only once every asset above is attached.
      # A release that is already published is left alone: a manual dispatch
      # for an older tag must not move latest back. A draft older than the
      # current latest is published without becoming it.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.resolve.outputs.tag_name }}
        run: |
          draft=$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)
          if [ "$draft" != true ]; then
            echo "$TAG_NAME is already published; latest stays where it is"
            exit 0
          fi
          # A failed lookup fails the step: the release stays a draft, which
          # is safe, where guessing could make an older release latest.
          latest=$(gh release view --json tagName --jq .tagName)
          version_of() {
            if ! printf '%s\n' "$1" | grep -Eq '^jlo-bin-v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::$1 is not jlo-bin-vX.Y.Z" >&2
              return 1
            fi
            echo "${1#jlo-bin-v}"
          }
          this=$(version_of "$TAG_NAME")
          current=$(version_of "$latest")
          newest=$(printf '%s\n%s\n' "$current" "$this" | sort -V | tail -n 1)
          make_latest=false
          [ "$newest" = "$this" ] && make_latest=true
          gh release edit "$TAG_NAME" --draft=false --latest="$make_latest"
